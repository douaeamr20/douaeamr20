<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="t d">
<title id="t">RadioVision — appointment lifecycle</title>
<desc id="d">Seven steps: book online, simulated advance payment with a 3-hour timer, confirmed, patient arrived, final payment with PDF invoice, medical report written and validated, results online. Five roles: patient, secretary, radiologist, technician, admin.</desc>
<defs><style>@font-face{font-family:'DA Grotesk';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'DA Grotesk';font-weight:700;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'DA Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'DA Mono';font-weight:600;src:url(data:font/woff2;base64,) format('woff2');}
.mono{font-family:'DA Mono',Consolas,'SF Mono',Menlo,'DejaVu Sans Mono',monospace;font-weight:400}.mono6{font-family:'DA Mono',Consolas,'SF Mono',Menlo,'DejaVu Sans Mono',monospace;font-weight:600}
.grot5{font-family:'DA Grotesk','Segoe UI',Helvetica,Arial,sans-serif;font-weight:500}.grot7{font-family:'DA Grotesk','Segoe UI',Helvetica,Arial,sans-serif;font-weight:700}
.flow{stroke-dasharray:6 10;animation:fl 1.2s linear infinite}@keyframes fl{to{stroke-dashoffset:-16}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070F1E"/><stop offset="1" stop-color="#0D2042"/></linearGradient>
  <linearGradient id="rail" x1="110" x2="1090" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#22D3EE"/><stop offset=".45" stop-color="#2F7CF6"/><stop offset=".75" stop-color="#FF6B6B"/><stop offset="1" stop-color="#FFD166"/></linearGradient>
  <filter id="glowf" x="-300%" y="-300%" width="700%" height="700%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
  <clipPath id="frame"><rect width="1200" height="360" rx="24"/></clipPath>
</defs>
