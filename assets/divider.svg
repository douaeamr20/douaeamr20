<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 30" width="1200" height="30" role="img" aria-label="Gradient divider">
<defs>
  <linearGradient id="track" x1="0" x2="1"><stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset=".15" stop-color="#22D3EE"/><stop offset=".45" stop-color="#2F7CF6"/><stop offset=".7" stop-color="#FF6B6B"/><stop offset=".85" stop-color="#FF9F43"/><stop offset="1" stop-color="#FF9F43" stop-opacity="0"/></linearGradient>
  <linearGradient id="glow" x1="0" x2="1"><stop offset="0" stop-color="#FFD166" stop-opacity="0"/><stop offset=".5" stop-color="#FFD166"/><stop offset="1" stop-color="#FFD166" stop-opacity="0"/></linearGradient>
  <filter id="soft" x="-20%" y="-300%" width="140%" height="700%"><feGaussianBlur stdDeviation="2.2"/></filter>
  <style>.gem{animation:g 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes g{0%,100%{transform:rotate(45deg) scale(.8)}50%{transform:rotate(225deg) scale(1.1)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
</defs>
<rect x="0" y="14" width="1200" height="2" rx="1" fill="url(#track)" opacity=".55"/>
<g>
  <rect y="13" width="260" height="4" rx="2" fill="url(#glow)" filter="url(#soft)"/>
  <rect y="14" width="260" height="2" rx="1" fill="url(#glow)"/>
  <animateTransform attributeName="transform" type="translate" values="-280 0;1200 0" dur="5s" repeatCount="indefinite"/>
</g>
<rect class="gem" x="593" y="8" width="14" height="14" rx="3" fill="#FFD166" stroke="#FF6B6B" stroke-width="2"/>
</svg>